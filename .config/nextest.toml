[profile.default]
slow-timeout = { period = "180s", terminate-after = 1, grace-period = "5s" }
global-timeout = "10m"

[test-groups.compile-ui]
max-threads = 1

# Trybuild runners include nested compilation in their test runtime.
[[profile.default.overrides]]
filter = 'binary(/_ui$/)'
test-group = "compile-ui"
slow-timeout = { period = "60s", terminate-after = 10, grace-period = "5s" }
