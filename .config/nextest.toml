[profile.default]
slow-timeout = { period = "180s", terminate-after = 1, grace-period = "5s" }
# Two serialized UI runners may each consume their full compile budget.
global-timeout = "130m"

[test-groups.compile-ui]
max-threads = 1

# Trybuild runners include nested compilation and shared admission/cache waits.
[[profile.default.overrides]]
filter = 'binary(/_ui$/)'
test-group = "compile-ui"
slow-timeout = { period = "60s", terminate-after = 60, grace-period = "5s" }
