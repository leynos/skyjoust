# Repository-specific exceptions to the shared en-GB-oxendict policy.

schema = 1

[oxford]
stems = []

[words]
accepted = []

[words.corrections]
# "mold" names the linker (https://github.com/rui314/mold); it is not a
# misspelling of "mould" in that context.
mold = "mold"

[patterns]
ignore = [
  # Cargo requires this exact environment variable.
  '\bCARGO_TERM_COLOR\b',
  # GitHub requires this exact pull-request event list.
  'types: \[opened, reopened, synchronize, labeled, ready_for_review\]',
  # Preserve formal upstream documentation names across line wrapping.
  'Azure Architecture\s+Center\s+\|\s+Microsoft Learn',
  'GitHub\s+Flavored\s+Markdown',
  # "mold" names the linker (https://github.com/rui314/mold) in these
  # specific phrasings only. A blanket [words.corrections] exception
  # would stop typos catching genuine "mould" misspellings anywhere
  # else in the repository's prose, so these patterns are scoped
  # tightly to how the linker's name actually appears.
  '-fuse-ld=mold',
  'mold linker',
  'Cranelift \+ mold',
  'Cranelift and mold',
  '`mold`',
]

[files]
exclude = []
