[package]
name = "rstest-bdd-harness-bevy"
version = "0.1.0"
edition = "2024"
description = "Headless Bevy harness adapter for rstest-bdd behavioural tests."
license = "ISC"
publish = false
readme = "README.md"

[lints]
workspace = true

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["std"] }
rstest-bdd-harness = "0.6.0"
tracing = "0.1"

[dev-dependencies]
googletest = "0.14.3"
pretty_assertions = "1"
proptest = "1"
rstest = "0.28"
rstest-bdd = "0.6.0"
rstest-bdd-macros = "0.6.0"
rstest-bdd-harness-bevy-test-macros = { path = "test-macros" }
trybuild = "1"
