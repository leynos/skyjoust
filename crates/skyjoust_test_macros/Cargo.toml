[package]
name = "skyjoust-test-macros"
version = "0.1.0"
edition = "2024"
description = "Test-only procedural macros that suppress lints raised by macro expansion."
license = "ISC"
publish = false

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "3.0", features = ["full"] }

[dev-dependencies]
rstest = "0.26.1"
trybuild = "1.0.116"
