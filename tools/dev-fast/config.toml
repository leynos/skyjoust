# Cargo configuration fragment the Make development targets pass explicitly,
# with `cargo --config tools/dev-fast/config.toml ...`.
#
# `.cargo/config.toml` now carries the estate build standard, which includes
# everything below (Cranelift for the development profile and `mold` on
# Linux), so this fragment repeats it. The Make targets keep passing it so the
# repository's dev-fast convention and its contract hold unchanged; retiring
# the fragment is a separate decision.
#
# Cargo joins the rustflags of every matching `[target.*]` entry
# (target-triple and `cfg` tables alike), but the joined target rustflags take
# precedence over `[build].rustflags` rather than merging with it.

[unstable]
codegen-backend = true

# Cranelift trades runtime performance for compile speed, so it applies to
# the dev profile only. The `make dev-*` targets never build release
# artefacts.
[profile.dev]
codegen-backend = "cranelift"

# mold ships for Linux only, so the flag is gated behind a target `cfg`. On
# macOS and Windows the table simply does not apply and the platform default
# linker is used.
[target.'cfg(target_os = "linux")']
rustflags = ["-Clink-arg=-fuse-ld=mold"]
