name: CI

'on':
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@872f59f53717b5bebe8e24b2f4a7496b089a939a
        with:
          install-mold: 'true'
          install-clang-lld: 'true'
      - name: Setup uv
        uses: astral-sh/setup-uv@c97f06e356bcca1b426f396ef93ec35ce149ce7b
        with:
          version: '0.11.28'
          # A Rust-only repository has no Python dependency manifest for the
          # cache key, so caching would only warn about unmatched inputs.
          enable-cache: false
      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@872f59f53717b5bebe8e24b2f4a7496b089a939a
        with:
          version: "0.6.1"

      - name: Format
        run: make check-fmt
      - name: Spelling
        run: make spelling
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff
        with:
          globs: '**/*.md'
      - name: Install the Whitaker Dylint suite
        uses: leynos/shared-actions/.github/actions/install-whitaker@5a99aed78ce68dcebd3052b75c31e6f173162b1e
      - name: Lint
        run: make lint
      - name: Test under Cranelift
        # Coverage holds the development profile on LLVM, so it cannot show
        # that the whole suite passes under Cranelift; this step does.
        run: make test
        timeout-minutes: 240
      - name: Workflow contract tests
        run: make test-workflow-contracts

  # Keep the bounded Rust workloads in sequential jobs, each with its own
  # six-hour hosted-job limit.
  coverage-ratchet:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@872f59f53717b5bebe8e24b2f4a7496b089a939a
        with:
          install-mold: 'true'
          install-clang-lld: 'true'
      - name: Prepare test dependencies
        run: make test-prepare
        timeout-minutes: 15
      - name: Test and Measure Coverage
        timeout-minutes: 240
        uses: leynos/shared-actions/.github/actions/generate-coverage@872f59f53717b5bebe8e24b2f4a7496b089a939a
        with:
          output-path: lcov.info
          format: lcov
          # Allows cold LLVM compilation before Nextest's 190-minute run.
          cargo-wait-timeout: '13200'
          # The pull request measures coverage for its own ratchet check and
          # nothing else: it neither publishes the report nor contacts
          # CodeScene. Main owns both, in coverage-main.yml, and
          # `make test-workflow-contracts` holds the split.
          with-ratchet: 'true'
          # Reset after the nightly-2026-10-30 bump lowered measured coverage:
          # a new path misses the restored baseline cache entry.
          baseline-rust-file: .coverage-baseline-v2.rust
          publish-artefact: 'false'
